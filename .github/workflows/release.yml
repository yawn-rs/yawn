name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag is the version of the crates
        run: |
          version=$(cargo pkgid -p yawn-cli | sed 's/.*[#@]//')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, crates $version" >&2; exit 1; }
      - run: cargo test --workspace

  binaries:
    needs: check
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p yawn-cli --target ${{ matrix.target }}
      - name: Archive
        shell: bash
        run: |
          name=yawn-cli-${{ matrix.target }}
          out=target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = Windows ]; then
            7z a "$name.zip" "./$out/yawn.exe"
          else
            tar -czf "$name.tgz" -C "$out" yawn
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: yawn-cli-${{ matrix.target }}
          path: yawn-cli-*

  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: archives
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" archives/* --repo "$GITHUB_REPOSITORY" --generate-notes

  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --workspace --locked
