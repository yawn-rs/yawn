[package]
name = "yawn-web"
version.workspace = true
edition.workspace = true
description = "Yawn framework core: project config, HTTP dev/production server (native) and DOM runtime (wasm)"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "yawn"

[features]
default = ["server"]
json = ["dep:serde", "dep:serde_json"]
config = ["dep:serde", "dep:toml"]
http = ["dep:serde", "dep:serde_json", "dep:form_urlencoded", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:hyper-rustls", "dep:rustls", "dep:webpki-roots", "dep:tokio"]
server = ["config", "dep:axum", "dep:hyper", "dep:hyper-util", "dep:tokio", "dep:tokio-stream", "dep:tower-http", "dep:serde_json", "dep:libc", "dep:sha2"]

[dependencies]
yawn-reactivity.workspace = true
serde = { version = "1", features = ["derive"], optional = true }

serde_json = { version = "1", optional = true }
form_urlencoded = { version = "1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
toml = { version = "0.8", optional = true }
hyper = { version = "1", optional = true, default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", optional = true, default-features = false, features = ["client-legacy", "http1", "tokio", "service"] }
http-body-util = { version = "0.1", optional = true }
hyper-rustls = { version = "0.27", optional = true, default-features = false, features = ["http1", "ring", "tls12"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "query"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", optional = true, features = ["sync", "time"] }
sha2 = { version = "0.10", optional = true }
tower-http = { version = "0.6", optional = true, features = ["fs", "set-header", "compression-gzip", "compression-br"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.129", features = ["enable-interning"] }
