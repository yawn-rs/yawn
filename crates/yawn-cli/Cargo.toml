[package]
name = "yawn-cli"
version.workspace = true
edition.workspace = true
description = "The `yawn` command line tool: argument handling, event pipeline and terminal UI"
license.workspace = true
repository.workspace = true
keywords = ["cli", "web", "wasm", "rsx", "dev-server"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
rust-version.workspace = true

[[bin]]
name = "yawn"
path = "src/main.rs"
doc = false
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ratatui = { version = "0.30.0", features = ["scrolling-regions"] }
yawn-web = { workspace = true, features = ["config"] }
yawn-rsx.workspace = true
notify = "9"
serde_json = "1"
brotli = "8"
zstd = "0.13"
sha2 = "0.10"
yawn-split = { path = "../yawn-split", version = "0.1.0" }
wasm-bindgen-cli-support = "=0.2.129"
syn = { version = "3", features = ["full", "visit-mut"] }
quote = "1"

[target."cfg(unix)".dependencies]
signal-hook = "0.4.6"
libc = "0.2"
